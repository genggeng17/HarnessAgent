[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-agent"
version = "0.1.0"
description = "本地、可测试、可恢复的 Coding Agent Harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.12,<3",
]

[project.scripts]
harness-agent = "harness_agent.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
]

[tool.setuptools.packages.find]
include = ["harness_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
