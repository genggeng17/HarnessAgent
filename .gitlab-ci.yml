stages:
  - test
  - build
  - publish

default:
  image: python:3.12
  cache:
    key: pip-${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/pip/
  before_script:
    - python -m pip install --upgrade pip

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

unit-test:
  stage: test
  script:
    - python -m pip install -e ".[dev]"
    - python -m pytest

package-build:
  stage: build
  script:
    - python -m pip install build twine
    - python -m build
    - python -m twine check dist/*
    - python -m venv .package-smoke
    - .package-smoke/bin/python -m pip install dist/*.whl
    - .package-smoke/bin/harness-agent --help
    - .package-smoke/bin/harness-agent credentials --help
  artifacts:
    name: "harness-agent-${CI_COMMIT_REF_SLUG}"
    paths:
      - dist/
    expire_in: 30 days

package-publish:
  stage: publish
  needs:
    - job: package-build
      artifacts: true
  script:
    - python -m pip install twine
    - python -m twine upload --repository-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi" --username gitlab-ci-token --password "${CI_JOB_TOKEN}" dist/*
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
